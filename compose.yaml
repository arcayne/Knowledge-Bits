services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-bits-local-demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_bits_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_bits_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - knowledge-bits-local-demo-postgres-data:/var/lib/postgresql/data

volumes:
  knowledge-bits-local-demo-postgres-data:
    name: knowledge-bits-local-demo-postgres-data
