name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Scan for forbidden Nuglet credentials
        run: pnpm scan:forbidden-credentials

      - name: Build workspace
        run: pnpm build

      - name: Pull PostgreSQL test image
        run: timeout 180s docker pull postgres:16-alpine

      - name: Test workspace and clean fixture workflow
        run: pnpm test

      - name: Typecheck workspace
        run: pnpm typecheck
