name: Feature request
description: Propose a focused improvement to Knowledge Bits.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private links, or confidential product information. For security concerns, use SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior and its boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List alternatives and why they do not solve the problem.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and operational impact
      description: Explain effects on stages, adapters, schemas, checksums, migrations, security, rights, or hosting.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Describe tests, fixtures, or documentation checks that would demonstrate the change.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I kept this request within the documented project scope.
          required: true
        - label: I removed secrets and private information.
          required: true
